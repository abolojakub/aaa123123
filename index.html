<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wprowadź imię</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .spinner {
      margin-top: 20px;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 20px; font-size: 24px; display: none; }
  </style>
</head>
<body>

<h2>Podaj swoje imię:</h2>
<form id="form">
  <input type="text" id="name" placeholder="Jan" required>
  <button type="submit">Wyślij</button>
</form>

<div id="spinner" class="spinner"></div>
<div id="result" class="result"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAchP5CdU3vI2SGlbE1EHG2RRiY6x22Er8",
    authDomain: "test1-f789e.firebaseapp.com",
    databaseURL: "https://test1-f789e-default-rtdb.firebaseio.com",
    projectId: "test1-f789e",
    storageBucket: "test1-f789e.firebasestorage.app",
    messagingSenderId: "70327501208",
    appId: "1:70327501208:web:2cdab4787128b79e232bed",
    measurementId: "G-3390TKDWJB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const form = document.getElementById("form");
  const spinner = document.getElementById("spinner");
  const result = document.getElementById("result");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    if (!name) return;

    spinner.style.display = "block";
    result.style.display = "none";

    const id = Date.now();
    set(ref(db, 'submissions/' + id), {
      id: id,
      name: name,
      time: new Date().toISOString(),
      status: "pending"
    });

    // Polling co sekundę, żeby sprawdzać status
    const interval = setInterval(async () => {
      const snap = await get(child(ref(db), 'submissions/' + id));
      if (!snap.exists()) return;
      const data = snap.val();
      if (data.status === "accepted") {
        clearInterval(interval);
        spinner.style.display = "none";
        result.textContent = "✔ Zaakceptowano";
        result.style.color = "green";
        result.style.display = "block";
      }
      if (data.status === "rejected") {
        clearInterval(interval);
        spinner.style.display = "none";
        result.textContent = "❌ Odrzucono";
        result.style.color = "red";
        result.style.display = "block";
      }
    }, 1000);

    form.reset();
  });
</script>

</body>
</html>
