<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wprowadź imię</title>
  <style>
    body { font-family: Arial; margin: 40px; }
  </style>
</head>
<body>

<h2>Podaj swoje imię:</h2>

<form id="form">
  <input type="text" id="name" placeholder="Jan" required>
  <button type="submit">Wyślij</button>
</form>

<p id="msg"></p>

<script>
  document.getElementById("form").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();

    if (!name) return;

    // Odczytaj listę z localStorage
    const list = JSON.parse(localStorage.getItem("names") || "[]");

    // Dodaj nowy wpis
    list.push({
      name: name,
      time: new Date().toLocaleString()
    });

    // Zapisz ponownie
    localStorage.setItem("names", JSON.stringify(list));

    // Komunikat dla użytkownika
    document.getElementById("msg").textContent = "Dziękujemy!";
    document.getElementById("form").reset();
  });
</script>

</body>
</html>
