<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel admina – własny serwer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0b0d;
            color: #eee;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-panel {
            background: #1c1d22;
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        h1 { font-size: 22px; margin-top: 0; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #aaa;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #2d2e35;
            color: #eee;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: #00b6ff; }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #3a9e42; }
        .btn-danger { background: #7a2e2e; }
        .btn-danger:hover { background: #a13a3a; }
        .preview {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 16px;
        }
        .preview-title { color: #aaa; font-size: 14px; margin-bottom: 8px; }
        .preview-box {
            background: #0b0b0d;
            padding: 16px;
            border-radius: 6px;
            border: 1px dashed #555;
            min-height: 60px;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .status.success { color: #8bc34a; background: #1a2a1a; }
        .status.error { color: #ff8a8a; background: #2a1a1a; }
        .status.info { color: #90caf9; background: #1a2a3a; }
    </style>
</head>
<body>
    <div class="admin-panel">
        <h1>⚙️ Panel administratora (własny serwer)</h1>
        <p style="color:#aaa; font-size:14px;">Wpisz dowolny kod HTML. Po zapisaniu treść trafi na serwer i będzie dostępna dla strony głównej.</p>

        <label for="contentArea">Treść (HTML):</label>
        <textarea id="contentArea" placeholder="Np. <table>...</table> lub <div>Twoja treść</div>"></textarea>

        <div class="actions">
            <button class="btn" id="saveBtn">💾 Zapisz na serwerze</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ Wyczyść</button>
            <button class="btn" id="loadBtn" style="background:#2a4a6b;">📥 Pobierz obecną treść</button>
        </div>
        <div id="status" class="status info">📡 Połącz z serwerem (http://localhost:3000)</div>

        <div class="preview">
            <div class="preview-title">👁️ Podgląd:</div>
            <div class="preview-box" id="previewBox">
                <span style="color:#666; font-style:italic;">(puste)</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://77.45.88.147:3000/api/content';
        const textarea = document.getElementById('contentArea');
        const previewBox = document.getElementById('previewBox');
        const statusDiv = document.getElementById('status');

        function setStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + type;
        }

        function updatePreview(html) {
            if (html && html.trim() !== '') {
                previewBox.innerHTML = html;
            } else {
                previewBox.innerHTML = '<span style="color:#666; font-style:italic;">(puste)</span>';
            }
        }

        // Zapisz na serwerze
        async function saveContent() {
            const content = textarea.value.trim();
            setStatus('⏳ Wysyłanie na serwer...', 'info');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (!response.ok) throw new Error('Błąd odpowiedzi serwera');
                const data = await response.json();
                if (data.success) {
                    setStatus('✅ Zapisano! Treść jest teraz dostępna dla wszystkich (na localhost).', 'success');
                    updatePreview(content);
                } else {
                    setStatus('❌ Błąd zapisu: ' + (data.error || 'nieznany'), 'error');
                }
            } catch (error) {
                setStatus('❌ Błąd połączenia: ' + error.message + '. Uruchom serwer (node server.js).', 'error');
            }
        }

        // Pobierz z serwera
        async function loadFromServer() {
            setStatus('⏳ Pobieranie z serwera...', 'info');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Błąd sieci');
                const data = await response.json();
                const content = data.content || '';
                textarea.value = content;
                updatePreview(content);
                if (content.trim() === '') {
                    setStatus('📭 Serwer zwrócił pustą treść.', 'info');
                } else {
                    setStatus('✅ Pobrano treść z serwera.', 'success');
                }
            } catch (error) {
                setStatus('❌ Błąd połączenia: ' + error.message + '. Uruchom serwer (node server.js).', 'error');
            }
        }

        // Wyczyść (ustaw pustą treść na serwerze)
        async function clearContent() {
            if (!confirm('Na pewno wyczyścić treść na serwerze?')) return;
            textarea.value = '';
            setStatus('⏳ Wysyłanie pustej treści...', 'info');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: '' })
                });
                if (!response.ok) throw new Error('Błąd');
                const data = await response.json();
                if (data.success) {
                    setStatus('🗑️ Wyczyszczono!', 'success');
                    updatePreview('');
                } else {
                    setStatus('❌ Błąd', 'error');
                }
            } catch (error) {
                setStatus('❌ Błąd połączenia: ' + error.message, 'error');
            }
        }

        // Eventy
        document.getElementById('saveBtn').addEventListener('click', saveContent);
        document.getElementById('clearBtn').addEventListener('click', clearContent);
        document.getElementById('loadBtn').addEventListener('click', loadFromServer);

        // Ctrl+S
        textarea.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveContent();
            }
        });

        // Podgląd na bieżąco
        textarea.addEventListener('input', function() {
            updatePreview(this.value);
        });

        // Załaduj przy starcie
        loadFromServer();
    </script>
</body>
</html>
