<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Panel Admin</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .box { padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; }
  </style>
</head>
<body>

<h2>Panel Admin — zapisane imiona</h2>

<div id="list">Ładowanie...</div>

<script>
  const data = JSON.parse(localStorage.getItem("names") || "[]");
  const list = document.getElementById("list");

  if (data.length === 0) {
    list.textContent = "Brak wpisów.";
  } else {
    list.innerHTML = "";
    data.forEach(entry => {
      const div = document.createElement("div");
      div.className = "box";
      div.textContent = entry.name + " (czas: " + entry.time + ")";
      list.appendChild(div);
    });
  }
</script>

</body>
</html>
